<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Receipt | DropShip St lucia Tshirt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="logo.jpg" alt="Logo">
                <span>DropShip St lucia Tshirt</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#products">Catalog</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Receipt Section -->
    <section class="container">
        <div class="receipt-container" id="receipt-details">
            <!-- Receipt details will be loaded here by script.js -->
            <div style="text-align: center; padding: 2rem;">Loading receipt details...</div>
        </div>

        <div style="text-align: center; margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
            <button onclick="window.print()" class="cta-button">Print Receipt</button>
            <a href="index.html" class="cta-button" style="background-color: #333; border: 1px solid #333;">Continue Shopping</a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 DropShip St Lucia Tshirt. All rights reserved.
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
