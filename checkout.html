<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V4SRDSTHVH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-V4SRDSTHVH');
    </script>
    <title>Checkout | DropShip St lucia Tshirt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="logo.jpg" alt="Logo">
                <span>DropShip St lucia Tshirt</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#products">Catalog</a></li>
            </ul>
            <div class="cart-icon">
                🛒 <span id="cart-count">0</span>
            </div>
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Checkout Section -->
    <section class="container">
        <h2>Secure Checkout</h2>
        
        <div class="checkout-grid">
            <!-- Order Summary -->
            <div class="order-summary">
                <h3>Your Cart</h3>
                <div id="checkout-cart-items">
                    <!-- Items injected by JS -->
                </div>
                <div class="cart-total">
                    <strong>Total: $<span id="checkout-total">0.00</span></strong>
                </div>
            </div>

            <!-- Shipping Form -->
            <div class="shipping-form contact-form-container" style="margin:0;">
                <h3>Shipping Details</h3>
   <form action="https://formspree.io/f/xnjbqeez" method="POST">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="name" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" name="address" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" required>
                    </div>


                    <!-- Hidden field containing cart items -->
                    <input type="hidden" name="order_details" id="order-details-input">
                    <input type="hidden" name="_subject" value="New Order from DropShip St Lucia">
                    <input type="hidden" name="_next" value="index.html">

                    <button type="submit" class="cta-button" style="width:100%; border:none; cursor:pointer;">Place Order</button>
                </form>

                <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                    <p style="text-align: center; margin-bottom: 10px;">Or pay with:</p>
                    <div id="paypal-button-container"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>
    <script src="script.js"></script>
</body>
</html>
