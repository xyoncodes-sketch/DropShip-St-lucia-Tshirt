<head>

    <title>Checkout | DropShip St lucia Tshirt</title>
    <link rel="stylesheet" href="style.css">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("YOUR_PUBLIC_KEY"); // Replace with your actual EmailJS Public Key
        })();
    </script>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T5V2SKM3"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="logo.jpg" alt="Logo">
                <span>DropShip St lucia Tshirt</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#products">Catalog</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="cart-icon" onclick="toggleCart()">
                🛒 <span id="cart-count">0</span>
            </div>
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Checkout Section -->
    <section class="container">
        <h2>Checkout</h2>
        <div class="checkout-grid">
            <!-- Cart Items -->
            <div class="cart-section">
                <h3>Your Items</h3>
                <div id="checkout-cart-items">
                    <!-- Items will be loaded here -->
                </div>
            </div>

            <!-- Order Summary & Payment -->
            <div class="order-summary">
                <h3>Order Details</h3>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Shipping Address</label>
                        <textarea id="address" name="address" rows="3" required></textarea>
                    </div>
                    
                    <!-- Hidden input to store cart details for Formspree -->
                    <input type="hidden" id="order-details-input" name="order_details">

                    <div class="cart-total">
                        Total: $<span id="checkout-total">0.00</span>
                    </div>

                    <button type="submit" class="cta-button" style="width: 100%; border: none; cursor: pointer; margin-top: 1rem;">
                        Place Order
                    </button>
                </form>

                <button id="whatsapp-checkout-btn" class="cta-button" style="width: 100%; border: none; cursor: pointer; margin-top: 1rem; background-color: #25D366; color: white;">
                    Order via WhatsApp
                </button>

                <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #666;">
                    PayPal is for single item payments. WhatsApp is for multiple item payments.
                </p>

                <!-- Dynamic Payment Link Container -->
                <div id="payment-link-container"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 DropShip St Lucia Tshirt. All rights reserved.
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
